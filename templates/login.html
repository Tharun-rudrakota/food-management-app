{% extends 'base.html' %}

{% block title %}Sign In - FreshPantry{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="w-16 h-16 rounded-2xl bg-[#14392a] flex items-center justify-center text-[#f3ba2f] shadow-lg shadow-emerald-900/10 mx-auto mb-4">
            <i class="fa-solid fa-seedling text-2xl"></i>
        </div>
        <h2 class="text-3xl font-black text-slate-900 tracking-tight">Sign in to FreshPantry</h2>
        <p class="mt-2 text-sm text-slate-600">
            Or <a href="{{ url_for('register') }}" class="font-bold text-[#157a4e] hover:underline">create a new account</a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/60 rounded-3xl border border-slate-100 sm:px-10">
            <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700">Username or Email</label>
                    <div class="mt-1 relative rounded-xl shadow-2xs">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-user"></i>
                        </div>
                        <input id="username" name="username" type="text" required autofocus
                            class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                            placeholder="Enter your username or email">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700">Password</label>
                    <div class="mt-1 relative rounded-xl shadow-2xs">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input id="password" name="password" type="password" required
                            class="block w-full pl-10 pr-10 py-2.5 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-[#059669] hover:bg-[#047857] transition">
                        Sign In
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
